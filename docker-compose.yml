version: "3.9"

services:
  # ── FastAPI serving ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FIRMS_API_KEY=${FIRMS_API_KEY:-}
      - DRIFT_REPORT_PATH=/app/data/reports/drift_latest.html
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── MLflow tracking server ───────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: >
      sh -c "pip install mlflow --quiet &&
             mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:///mlflow.db
               --default-artifact-root /mlflow/mlruns"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Prefect worker ───────────────────────────────────────────────────────────
  prefect-worker:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install prefect --quiet &&
             prefect worker start --pool default-agent-pool"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FIRMS_API_KEY=${FIRMS_API_KEY:-}
      - PYTHONPATH=/app
    volumes:
      - ./:/app
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mlflow_data:
